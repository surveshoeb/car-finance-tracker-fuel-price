name: Fetch fuel price

on:
  schedule:
    # Twice daily. GitHub's scheduler can run a few minutes late under
    # load — that's fine for a value that only needs to be roughly current.
    - cron: '0 3,15 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data/fuel-price.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # native fetch(), no dependencies needed

      - run: node scripts/fetch-price.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update fuel price'
          file_pattern: data/fuel-price.json
